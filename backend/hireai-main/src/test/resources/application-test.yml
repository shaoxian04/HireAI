# Test-profile overrides, layered over src/main/resources/application.yml.
hireai:
  arbitration:
    # Dispute fees (#96) are off by default in tests, so settlement assertions elsewhere stay exact;
    # DisputeFeesAndAppealsIntegrationTest turns them on with its own values.
    cost: 0
    appeal-fee: 0
  ai-review:
    # The scripted reviewer's transient failures are retried without a real wait (#107).
    retry-backoff: PT0.05S
